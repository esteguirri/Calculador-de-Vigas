<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analizador de vigas</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f8;--c:#fff;--t:#1b2330;--m:#6a7485;--b:#d3d9e2;--a:#1d6fe8}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#13161b;--c:#1c2128;--t:#e6e9ee;--m:#98a2b3;--b:#333b47;--a:#4a90f0}}
:root[data-theme=dark]{--bg:#13161b;--c:#1c2128;--t:#e6e9ee;--m:#98a2b3;--b:#333b47;--a:#4a90f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:880px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 10px}h2{font-size:15px;margin:0 0 8px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:6px}
label{font-size:12px;color:var(--m);display:flex;flex-direction:column;gap:2px}
input,select,button{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:8px;min-height:42px;box-sizing:border-box}
input{width:96px}select{max-width:160px}
button{cursor:pointer;background:var(--a);color:#fff;border:0;padding:8px 14px}
button.g{background:var(--bg);color:var(--t);border:1px solid var(--b)}button.x{padding:6px 10px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:3px 5px;border-bottom:1px solid var(--b);text-align:right}th:first-child,td:first-child{text-align:left}
.tw{overflow-x:auto}.tw input{width:84px}
.err{color:#d33;font-weight:600}.warn{color:#b87500}.hint{color:var(--m);font-size:12px;margin:4px 0}
.sv{overflow-x:auto}.sv svg{min-width:560px;display:block;width:100%;height:auto}
pre{white-space:pre-wrap;font-size:12px;overflow-x:auto}
</style></head><body><main>
<noscript><p>Esta página necesita JavaScript. Ábrela en Safari o Chrome desde un enlace web (no desde el visor de WhatsApp).</p></noscript>
<h1>🏗️ Analizador de vigas</h1>
<div class="card" id="gen"><h2>1. Datos generales</h2>
<div class="row"><label>Longitud L<input id="L" type="number" step="any"></label><label>Unidad de longitud<select id="lu"></select></label><label>Unidad de fuerza<select id="fu"></select></label><label>Unidad de y<select id="du"></select></label></div>
<div class="row"><label>E<input id="E" type="number" step="any"></label><label>Unidad de E<select id="eu"></select></label><label>I<input id="I" type="number" step="any"></label><label>Unidad de I<select id="iu"></select></label></div>
<div class="row"><button class="g" onclick="ex(1)">Ejemplo 1 (doble integración)</button><button class="g" onclick="ex(2)">Ejemplo 2 (Macaulay)</button></div></div>
<div class="card"><h2>2. Apoyos</h2><div class="tw" id="sup"></div><div class="row"><button class="g" onclick="D.sup.push({t:'roller',x:0});tbl();run()">+ Apoyo</button></div></div>
<div class="card"><h2>3. Cargas</h2><div class="tw" id="lds"></div>
<div class="row"><button class="g" onclick="addL('P')">+ Puntual vertical</button><button class="g" onclick="addL('H')">+ Puntual horizontal</button><button class="g" onclick="addL('M')">+ Momento</button><button class="g" onclick="addL('W')">+ Distribuida</button></div>
<p class="hint">Signos: vertical ↑ positiva (↓ negativa), horizontal → positiva, momento horario ↻ positivo. En distribuidas, w₁ y w₂ son las intensidades en x₁ y x₂ (uniforme: w₁ = w₂; triangular: una es 0).</p></div>
<div id="res"></div>
</main>
<script>
const $=s=>document.querySelector(s),num=e=>parseFloat(e.value)||0;
const LU={m:1,cm:.01,mm:.001,ft:.3048,in:.0254},FU={N:1,kN:1e3,kgf:9.80665,tonf:9806.65,lbf:4.448222,kip:4448.222},
EU={GPa:1e9,MPa:1e6,'kgf/cm²':98066.5,'tonf/m²':9806.65,ksi:6894757,psi:6894.757},
IU={'m⁴':1,'cm⁴':1e-8,'mm⁴':1e-12,'in⁴':4.162314e-7,'ft⁴':8.630975e-3};
const fill=(id,o,d)=>$(id).innerHTML=Object.keys(o).map(k=>`<option ${k==d?'selected':''}>${k}</option>`).join('');
const D={sup:[],loads:[]};let R=null,QX=null,DL=null;
const fmt=v=>{const a=Math.abs(v);return a<1e-12?'0':(a>=1e5||a<1e-3)?v.toExponential(3):String(+v.toPrecision(6))};
const sp=n=>String(n).replace(/\d/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]);
const NM={P:'Puntual vertical',H:'Puntual horizontal',M:'Momento',W:'Distribuida'},ST=[['pin','Articulado'],['roller','Rodillo'],['fixed','Empotrado']];
function ex(n){const set=(l,f,d,e,i,L,E,I)=>{$('#lu').value=l;$('#fu').value=f;$('#du').value=d;$('#eu').value=e;$('#iu').value=i;$('#L').value=L;$('#E').value=E;$('#I').value=I};
 if(n==1){set('cm','kgf','cm','kgf/cm²','cm⁴',450,2e6,1806.8242);D.sup=[{t:'pin',x:0},{t:'roller',x:300}];D.loads=[{t:'W',a:0,b:300,v:-20,w:-20},{t:'P',a:450,b:0,v:-12000,w:0}]}
 else{set('m','tonf','mm','tonf/m²','m⁴',6,2619160,0.003125);D.sup=[{t:'pin',x:0},{t:'roller',x:4}];D.loads=[{t:'W',a:4,b:6,v:-3,w:-3}]}
 QX=null;tbl();run()}
function addL(t){D.loads.push({t,a:0,b:0,v:0,w:0});tbl();run()}
function tbl(){
 $('#sup').innerHTML='<table><tr><th>Tipo</th><th>x</th><th></th></tr>'+D.sup.map((s,i)=>`<tr><td><select onchange="D.sup[${i}].t=this.value;run()">${ST.map(o=>`<option value="${o[0]}" ${o[0]==s.t?'selected':''}>${o[1]}</option>`).join('')}</select></td><td><input type="number" step="any" value="${s.x}" oninput="D.sup[${i}].x=num(this);run()"></td><td><button class="g x" onclick="D.sup.splice(${i},1);tbl();run()">✕</button></td></tr>`).join('')+'</table>';
 $('#lds').innerHTML='<table><tr><th>Tipo</th><th>x / x₁</th><th>x₂</th><th>Valor / w₁</th><th>w₂</th><th></th></tr>'+D.loads.map((c,i)=>{const I=(k,p)=>`<input type="number" step="any" placeholder="${p}" value="${c[k]}" oninput="D.loads[${i}].${k}=num(this);run()">`,w=c.t=='W';
 return `<tr><td>${NM[c.t]}</td><td>${I('a','x')}</td><td>${w?I('b','x₂'):''}</td><td>${I('v',w?'w₁':'valor')}</td><td>${w?I('w','w₂'):''}</td><td><button class="g x" onclick="D.loads.splice(${i},1);tbl();run()">✕</button></td></tr>`}).join('')+'</table>'}
function gauss(A,b){const n=b.length,cs=[];A=A.map((r,i)=>{const s=Math.max(...r.map(Math.abs))||1;b[i]/=s;return r.map(v=>v/s)});
 for(let j=0;j<n;j++){cs[j]=Math.max(...A.map(r=>Math.abs(r[j])))||1;A.forEach(r=>r[j]/=cs[j])}
 for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;
  if(Math.abs(A[p][i])<1e-9)return null;[A[i],A[p]]=[A[p],A[i]];[b[i],b[p]]=[b[p],b[i]];
  for(let r=0;r<n;r++)if(r!=i){const m=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=m*A[i][c];b[r]-=m*b[i]}}
 return b.map((v,i)=>v/A[i][i]/cs[i])}
function solve(){
 const lu=$('#lu').value,fu=$('#fu').value,du=$('#du').value,k=LU[lu],f=FU[fu],L=num($('#L'))*k,dk=LU[du],
 EI=num($('#E'))*EU[$('#eu').value]*num($('#I'))*IU[$('#iu').value];
 if(!(L>0))throw 'La longitud debe ser mayor que 0.';if(!(EI>0))throw 'E e I deben ser mayores que 0.';
 if(!D.sup.length)throw 'Agrega al menos un apoyo.';
 const ok=x=>x>=-1e-9*L&&x<=L*(1+1e-9),S=D.sup.map(s=>({t:s.t,x:s.x*k}));
 if(S.some(s=>!ok(s.x)))throw 'Hay un apoyo fuera de la viga.';
 const Vt=[],Mt=[],Ht=[];
 for(const c of D.loads){const a=c.a*k,b=c.b*k;if(!ok(a))throw 'Hay una carga fuera de la viga.';
  if(c.t=='P')Vt.push([c.v*f,a,0]);else if(c.t=='H')Ht.push([c.v*f,a]);else if(c.t=='M')Mt.push([c.v*f*k,a,0]);
  else{if(!(b>a)||!ok(b))throw 'En cada carga distribuida, x₂ debe ser mayor que x₁ y estar dentro de la viga.';
   const w1=c.v*f/k,w2=c.w*f/k,q=(w2-w1)/(b-a);Vt.push([w1,a,1],[q/2,a,2],[-w2,b,1],[-q/2,b,2])}}
 const ev=(x,V,M,c1,c2)=>{let v=0,m=0,t=c1,y=c1*x+c2;
  for(const [c,a,n] of V)if(x>=a){const d=x-a;v+=c*d**n;m+=c/(n+1)*d**(n+1);t+=c/((n+1)*(n+2))*d**(n+2);y+=c/((n+1)*(n+2)*(n+3))*d**(n+3)}
  for(const [c,a] of M)if(x>=a){const d=x-a;m+=c;t+=c*d;y+=c*d*d/2}
  return [v,m,t,y]};
 const un=[];S.forEach(s=>{un.push({k:'R',x:s.x});if(s.t=='fixed')un.push({k:'M',x:s.x})});
 const nu=un.length+2,rows=[];S.forEach(s=>{rows.push([s.x,3]);if(s.t=='fixed')rows.push([s.x,2])});rows.push([L,0],[L,1]);
 const resp=(j,r)=>{const V=[],M=[];let c1=0,c2=0;if(j<un.length){const u=un[j];(u.k=='R'?V:M).push([1,u.x,0])}else if(j==un.length)c1=1;else c2=1;return ev(r[0],V,M,c1,c2)[r[1]]};
 const A=rows.map(r=>Array.from({length:nu},(_,j)=>resp(j,r))),bb=rows.map(r=>-ev(r[0],Vt,Mt,0,0)[r[1]]),sol=gauss(A,bb);
 if(!sol)throw 'La viga es inestable o está mal apoyada: usa un empotramiento o al menos 2 apoyos en posiciones distintas.';
 const Vf=Vt.slice(),Mf=Mt.slice();un.forEach((u,j)=>(u.k=='R'?Vf:Mf).push([sol[j],u.x,0]));
 const c1=sol[un.length],c2=sol[un.length+1],sumH=Ht.reduce((s,h)=>s+h[0],0),hs=S.findIndex(s=>s.t!='roller'),Hf=Ht.slice(),warn=[];
 if(hs>=0)Hf.push([-sumH,S[hs].x]);else if(Math.abs(sumH)>1e-9)warn.push('Hay fuerzas horizontales pero ningún apoyo articulado o empotrado las resiste.');
 if(S.filter(s=>s.t!='roller').length>1)warn.push('Hay más de un apoyo articulado/empotrado: la fuerza horizontal se asigna al primero de la lista.');
 const Nf=x=>-Hf.reduce((s,h)=>s+(x>=h[1]?h[0]:0),0);
 const reac=[];let j=0;S.forEach((s,i)=>{const ry=sol[j++];let mr=null;if(s.t=='fixed')mr=sol[j++];reac.push({t:s.t,x:D.sup[i].x,ry:ry/f,rx:i==hs?-sumH/f:null,mr:mr==null?null:mr/(f*k)})});
 const xs=[];for(let i=0;i<=800;i++)xs.push(L*i/800);
 [...S.map(s=>s.x),...D.loads.flatMap(c=>c.t=='W'?[c.a*k,c.b*k]:[c.a*k])].forEach(c=>{xs.push(c);if(c>0)xs.push(c-L*1e-9)});xs.sort((a,b)=>a-b);
 const f4=x=>ev(x,Vf,Mf,c1,c2),sc=[1/f,1/(f*k),1/EI,1/EI/dk];
 const raw=xs.map(x=>f4(x)),Ys=[xs.map(x=>Nf(x)/f),raw.map(r=>r[0]/f),raw.map(r=>r[1]*sc[1]),raw.map(r=>r[2]*sc[2]),raw.map(r=>r[3]*sc[3])];
 const refine=q=>{const g=q-1,pts=xs.slice();
  for(let i=0;i<xs.length-1;i++){let a=xs[i],b=xs[i+1],ga=f4(a)[g],gb=f4(b)[g];
   if(ga*gb<0){for(let t=0;t<50;t++){const m=(a+b)/2,gm=f4(m)[g];if(ga*gm<=0)b=m;else{a=m;ga=gm}}pts.push((a+b)/2)}}
  let mn={v:Infinity},mx={v:-Infinity};for(const x of pts){const v=f4(x)[q];if(v<mn.v)mn={v,x};if(v>mx.v)mx={v,x}}
  const s=sc[q==1?1:q==2?2:3];return [{v:mn.v*s,x:mn.x/k},{v:mx.v*s,x:mx.x/k}]};
 const scan=Y=>{let a=0,b=0;Y.forEach((v,i)=>{if(v<Y[a])a=i;if(v>Y[b])b=i});return [{v:Y[a],x:xs[a]/k},{v:Y[b],x:xs[b]/k}]};
 const exs=[scan(Ys[0]),scan(Ys[1]),refine(1),refine(2),refine(3)];
 const nm=[['Fuerza normal N',fu,'#e8590c'],['Fuerza cortante V',fu,'#2e9e4f'],['Momento flector M',fu+'·'+lu,'#d99a00'],['Ángulo θ','rad','#8e44ad'],['Deformación y',du,'#1f6feb']];
 const series=nm.map((n,i)=>{const am=Math.max(...Ys[i].map(Math.abs),1e-300),cl=v=>Math.abs(v)<1e-9*am?0:v;
  const e=exs[i].map(p=>({x:p.x,v:cl(p.v)}));return {name:n[0],unit:n[1],col:n[2],Y:Ys[i].map(cl),mn:e[0],mx:e[1],ex:e.filter((p,q)=>p.v!=0&&!(q==1&&p.v==e[0].v))}});
 const g=lv=>{const T=[];Vf.forEach(([c,a,n])=>{let d=1;for(let j=1;j<=lv;j++)d*=n+j;T.push([c*k**n/f/d,a/k,n+lv])});
  if(lv>0)Mf.forEach(([c,a])=>{let d=1;for(let j=1;j<lv;j++)d*=j;T.push([c/(f*k)/d,a/k,lv-1])});
  const m=Math.max(...T.map(t=>Math.abs(t[0])),1e-300);
  return T.filter(t=>Math.abs(t[0])>1e-9*m).map((t,i)=>(t[0]<0?' − ':i?' + ':'')+fmt(Math.abs(t[0]))+'⟨x'+(t[1]?'−'+fmt(t[1]):'')+'⟩'+sp(t[2])).join('')||'0'};
 const sg=v=>(v<0?' − ':' + ')+fmt(Math.abs(v)),K1=c1/(f*k*k),K2=c2/(f*k**3);
 const eq=`V(x) = ${g(0)}\nM(x) = ${g(1)}\nEI·θ(x) = ${g(2)}${sg(K1)}\nEI·y(x) = ${g(3)}${sg(K1)}·x${sg(K2)}\n\n⟨x−a⟩ⁿ = 0 si x < a; (x−a)ⁿ si x ≥ a. x en ${lu}, fuerzas en ${fu}.\nE·I = ${fmt(EI/(f*k*k))} ${fu}·${lu}²`;
 return {Ld:L/k,lu,fu,du,X:xs.map(x=>x/k),S:series,sx:D.sup.map(s=>s.x),reac,warn,eq,
  at:x=>{const r=f4(x*k);return [Nf(x*k)/f,r[0]/f,r[1]*sc[1],r[2]*sc[2],r[3]*sc[3]]}}}
const T=(x,y,t,c,a='middle')=>`<text x="${x}" y="${y}" fill="${c}" text-anchor="${a}">${t}</text>`;
const HD=(h,W=720)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${h}" width="${W}" height="${h}" font-family="system-ui,sans-serif" font-size="11">`;
function beam(th,R){const W=720,l=64,r=16,y0=92,Lx=R.Ld,X=v=>l+v/Lx*(W-l-r),F='#d9480f',P='#7048e8';
 const Ar=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${F}" stroke-width="2" marker-end="url(#ar)"/>`;
 let o=HD(170)+`<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="${F}"/></marker><marker id="am" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="${P}"/></marker></defs>`+T(l,14,'Viga y cargas',th.t,'start').replace('<text','<text font-weight="600"');
 o+=`<line x1="${X(0)}" x2="${X(Lx)}" y1="${y0}" y2="${y0}" stroke="${th.t}" stroke-width="5"/>`;
 const wm=Math.max(1e-300,...D.loads.filter(c=>c.t=='W').flatMap(c=>[Math.abs(c.v),Math.abs(c.w)]));
 D.sup.forEach(s=>{const x=X(s.x);
  if(s.t=='fixed')o+=`<line x1="${x}" x2="${x}" y1="${y0-22}" y2="${y0+22}" stroke="${th.t}" stroke-width="6"/>`;
  else{o+=`<path d="M${x},${y0+3}l-11,${s.t=='pin'?18:15}h22z" fill="none" stroke="${th.t}" stroke-width="2"/>`;
   o+=s.t=='pin'?`<line x1="${x-15}" x2="${x+15}" y1="${y0+21}" y2="${y0+21}" stroke="${th.t}" stroke-width="2"/>`:`<circle cx="${x}" cy="${y0+22}" r="4" fill="none" stroke="${th.t}" stroke-width="2"/>`}
  o+=T(x,y0+46,fmt(s.x),th.m)});
 D.loads.forEach(c=>{const x=X(c.a);
  if(c.t=='P'){const d=c.v<0;o+=(d?Ar(x,y0-50,x,y0-4):Ar(x,y0+52,x,y0+4))+T(x,d?y0-54:y0+64,fmt(c.v)+' '+R.fu,F)}
  else if(c.t=='H'){const p=c.v>0;o+=(p?Ar(x-42,y0-16,x,y0-16):Ar(x+42,y0-16,x,y0-16))+T(p?x-21:x+21,y0-21,fmt(c.v)+' '+R.fu,F)}
  else if(c.t=='M'){const cw=c.v>0;o+=`<path d="${cw?`M${x-14},${y0+12} A18,18 0 1,1 ${x+14},${y0+12}`:`M${x+14},${y0+12} A18,18 0 1,0 ${x-14},${y0+12}`}" fill="none" stroke="${P}" stroke-width="2" marker-end="url(#am)"/>`+T(x,y0-24,fmt(c.v)+' '+R.fu+'·'+R.lu,P)}
  else if(c.t=='W'&&c.b>c.a){const xa=X(c.a),xb=X(c.b),dn=(c.v+c.w)<=0,s=dn?-1:1,h=w=>5+6+24*Math.abs(w)/wm,ya=y0+s*h(c.v),yb=y0+s*h(c.w);
   o+=`<polygon points="${xa},${y0+s*5} ${xa},${ya} ${xb},${yb} ${xb},${y0+s*5}" fill="${F}" fill-opacity=".12" stroke="${F}"/>`;
   const n=Math.max(2,Math.round((xb-xa)/30));for(let i=0;i<=n;i++){const u=i/n,xx=xa+u*(xb-xa),yt=ya+u*(yb-ya);o+=Ar(xx,yt,xx,y0+s*5)}
   const u=R.fu+'/'+R.lu,ty=(v)=>v+(dn?-4:12);
   o+=c.v==c.w?T((xa+xb)/2,ty(Math.min(ya,yb)*(dn?1:0)+(dn?0:Math.max(ya,yb))),fmt(c.v)+' '+u,F):T(xa,ty(ya),fmt(c.v),F,'start')+T(xb,ty(yb),fmt(c.w)+' '+u,F,'end')}});
 return o+'</svg>'}
function plot(th,s,R){const W=720,H=165,l=64,r=16,t=24,b=22,Lx=R.Ld;
 let mn=Math.min(0,...s.Y),mx=Math.max(0,...s.Y);if(mx-mn<1e-300){mx=1;mn=-1}const p=(mx-mn)*.14;mn-=p;mx+=p;
 const X=v=>(l+v/Lx*(W-l-r)).toFixed(1),Y=v=>(t+(mx-v)/(mx-mn)*(H-t-b)).toFixed(1);
 let o=HD(H);R.sx.forEach(x=>o+=`<line x1="${X(x)}" x2="${X(x)}" y1="${t}" y2="${H-b}" stroke="${th.b}" stroke-dasharray="3 3"/>`);
 o+=T(l,14,s.name,th.t,'start').replace('<text','<text font-weight="600"')+T(W-r,14,'['+s.unit+']',th.m,'end');
 const pts=R.X.map((x,i)=>X(x)+','+Y(s.Y[i])).join(' ');
 o+=`<polygon points="${X(0)},${Y(0)} ${pts} ${X(Lx)},${Y(0)}" fill="${s.col}" fill-opacity=".18"/><polyline points="${pts}" fill="none" stroke="${s.col}" stroke-width="2"/><line x1="${l}" x2="${W-r}" y1="${Y(0)}" y2="${Y(0)}" stroke="${th.t}"/>`+T(l-6,+Y(0)+4,'0',th.m,'end');
 s.ex.forEach(e=>{const x=+X(e.x),y=+Y(e.v);o+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${s.col}"/>`+T(x,e.v>=0?y-7:y+16,fmt(e.v),th.t,x<l+45?'start':x>W-r-45?'end':'middle')});
 return o+T(l,H-5,'0',th.m,'start')+T(W-r,H-5,fmt(Lx)+' '+R.lu,th.m,'end')+'</svg>'}
const LT={t:'#1b2330',m:'#6a7485',b:'#d3d9e2'},TH=()=>{const c=getComputedStyle(document.documentElement),g=n=>c.getPropertyValue(n).trim();return {t:g('--t')||LT.t,m:g('--m')||LT.m,b:g('--b')||LT.b}};
const draw=(R,th)=>[beam(th,R),...R.S.map(s=>plot(th,s,R))];
function show(R){const nm={pin:'Articulado',roller:'Rodillo',fixed:'Empotrado'};
 let h=R.warn.map(w=>`<p class="warn">⚠ ${w}</p>`).join('');
 h+=`<div class="card"><h2>Reacciones</h2><div class="tw"><table><tr><th>Apoyo</th><th>x (${R.lu})</th><th>Ry (${R.fu}) ↑+</th><th>Rx (${R.fu}) →+</th><th>M (${R.fu}·${R.lu}) ↻+</th></tr>`+R.reac.map(r=>`<tr><td>${nm[r.t]}</td><td>${fmt(r.x)}</td><td>${fmt(r.ry)}</td><td>${r.rx==null?'—':fmt(r.rx)}</td><td>${r.mr==null?'—':fmt(r.mr)}</td></tr>`).join('')+'</table></div></div>';
 h+=`<div class="card"><h2>Diagramas</h2>`+draw(R,TH()).map(s=>`<div class="sv">${s}</div>`).join('')+`<div class="row"><button class="g" onclick="exportPng()">Guardar imagen (PNG)</button></div></div>`;
 h+=`<div class="card"><h2>Valores máximos y mínimos</h2><div class="tw"><table><tr><th>Magnitud</th><th>Mínimo (x)</th><th>Máximo (x)</th></tr>`+R.S.map(s=>`<tr><td>${s.name} [${s.unit}]</td><td>${fmt(s.mn.v)} (${fmt(s.mn.x)})</td><td>${fmt(s.mx.v)} (${fmt(s.mx.x)})</td></tr>`).join('')+`</table></div><p class="hint">x en ${R.lu}.</p></div>`;
 h+=`<div class="card"><h2>Consultar en un punto</h2><div class="row"><label>x (${R.lu})<input id="qx" type="number" step="any" value="${QX}" oninput="qry()"></label></div><div id="qo"></div></div>`;
 return h+`<div class="card"><h2>Ecuaciones (funciones de singularidad)</h2><pre>${R.eq}</pre></div>`}
function qry(){if(!R)return;QX=num($('#qx'));if(QX<0||QX>R.Ld){$('#qo').textContent='x fuera de la viga.';return}
 const v=R.at(QX);$('#qo').innerHTML=`N = ${fmt(v[0])} ${R.fu}<br>V = ${fmt(v[1])} ${R.fu}<br>M = ${fmt(v[2])} ${R.fu}·${R.lu}<br>θ = ${fmt(v[3])} rad<br>y = ${fmt(v[4])} ${R.du}<br><span class="hint">En un salto (carga puntual) se muestra el valor justo a la derecha de x.</span>`}
function run(){const o=$('#res');try{R=solve();if(QX==null)QX=+(R.Ld/2).toFixed(4);o.innerHTML=show(R);qry()}catch(e){R=null;o.innerHTML=`<p class="err">${typeof e=='string'?e:'Error: '+e.message}</p>`}}
function exportPng(){if(!R)return;const p=draw(R,LT),hs=[170,165,165,165,165,165],tot=hs.reduce((a,b)=>a+b,0);let y=0;
 const svg=HD(tot).replace(/ width="720" height="\d+"/,` width="720" height="${tot}"`)+`<rect width="720" height="${tot}" fill="#fff"/>`+p.map((s,i)=>{const r=s.replace('<svg ',`<svg y="${y}" `);y+=hs[i];return r}).join('')+'</svg>';
 const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=1440;c.height=tot*2;c.getContext('2d').drawImage(im,0,0,1440,tot*2);
  c.toBlob(b=>{if(DL)DL.save({filename:'analisis_viga.png',data:b}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='analisis_viga.png';a.click()}},'image/png')};
 im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
fill('#lu',LU,'cm');fill('#fu',FU,'kgf');fill('#du',LU,'cm');fill('#eu',EU,'kgf/cm²');fill('#iu',IU,'cm⁴');
document.querySelectorAll('#gen input,#gen select').forEach(e=>{e.addEventListener('input',run);e.addEventListener('change',run)});
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',run)}catch(e){}
ex(1);
if(window.claude)claude.use('downloads').then(d=>{if(d){DL=d;run()}}).catch(()=>{});
</script></body></html>
